<style>
/* VOICE: alegre, clara, de aula; se lee desde el fondo del salón.
   IDEA: el pizarrón de rincones con carteles numerados y un reloj de tiempo restante.
   PICTURE: las tarjetas de estación con la banda de color del equipo y el reloj circular.
   COLOUR and TYPE: fondo papel tibio, tinta azul profunda, colores de equipo plenos; Baloo 2 + Nunito.
   LAYOUT: 3 + 2 tarjetas que llenan la pantalla, reloj al costado; se apila en pantallas chicas. */
:root{color-scheme:light dark;--bg:light-dark(#fdf8ee,#131a2e);--panel:light-dark(#fff,#1d2541);--ink:light-dark(#1b2240,#f4f1e8);--muted:light-dark(#545b7c,#b7bbd2);--line:light-dark(#e7dfcc,#353e60);--accent:light-dark(#2851b8,#8aa7ff);--on-accent:light-dark(#fff,#0f1530);--soft:light-dark(#f4edde,#262f4f);--sun:#ffc23d;--alarm:#e5383b;--ok:light-dark(#1d7a3c,#7fdc9b);--bad:light-dark(#b3261e,#ff9a90);--shadow:0 2px 0 light-dark(#ebe2cd,#0b1022),0 14px 28px -18px rgba(20,25,60,.45)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.disp{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.05;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:48px;padding:8px 18px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.big{min-height:58px;font-size:19px;padding:10px 24px}
.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.app{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(2vw,14px)}
.top h1{font-size:clamp(26px,2.2vw,36px);font-weight:800}
.round{font:800 clamp(20px,1.8vw,30px)/1 "Baloo 2",sans-serif;background:var(--ink);color:var(--bg);padding:10px 20px 8px;border-radius:999px;white-space:nowrap}
.top .sp{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{padding:8px 14px}
.banner{margin:0 max(2vw,14px) 14px;border-radius:24px;padding:14px 26px;background:var(--sun);color:#1b1d2e;display:flex;align-items:center;gap:12px 26px;flex-wrap:wrap;box-shadow:var(--shadow);animation:pop .5s ease-out}
.banner h2{font-size:clamp(46px,5vw,86px);font-weight:800}
.banner p{margin:0;font-size:clamp(17px,1.3vw,22px);font-weight:700;flex:1 1 260px}
.banner .btn{background:#1b1d2e;color:#fff;border-color:#1b1d2e}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.board{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) clamp(290px,25vw,430px);gap:clamp(12px,1.3vw,22px);padding:0 max(2vw,14px) max(1.6vw,14px)}
.cards{display:grid;grid-template-columns:repeat(var(--c2,6),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(12px,1.3vw,22px)}
.card{grid-column:var(--st,auto)/span 2;background:var(--panel);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;border:3px solid var(--tc)}
.cb{flex:1;min-height:0;overflow:auto;display:flex;gap:clamp(12px,1.2vw,20px);padding:clamp(14px,1.4vw,26px)}
.num{flex:none;width:clamp(54px,4.6vw,86px);height:clamp(54px,4.6vw,86px);border-radius:20px;background:var(--soft);font-size:clamp(32px,3vw,56px);font-weight:800;display:grid;place-items:center;padding-top:.1em}
.card h2{font-size:clamp(25px,2.3vw,46px);font-weight:800;text-wrap:balance}
.card p{margin:.45em 0 0;font-size:clamp(17px,1.25vw,24px);line-height:1.35;color:var(--muted)}
.card{container-type:inline-size}
.tband{flex:none;background:var(--tc);color:var(--tx);padding:clamp(10px,3.6cqi,18px) clamp(14px,6cqi,26px);display:grid;gap:4px}
.tname{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.tname b{font:800 clamp(17px,8cqi,40px)/1.15 "Baloo 2",sans-serif;overflow:hidden;text-overflow:ellipsis}
.tname small{margin-left:auto;flex:none;align-self:center;background:rgba(0,0,0,.2);border-radius:999px;min-width:2em;padding:3px 10px;text-align:center;font:800 clamp(14px,5cqi,22px)/1.2 Nunito,sans-serif}
.tmeta{display:flex;align-items:center;gap:10px;min-height:1.9em;font:800 clamp(13px,4.4cqi,18px)/1.2 Nunito,sans-serif;white-space:nowrap}
.next{background:rgba(0,0,0,.2);border-radius:999px;padding:3px 12px}
.mem{list-style:none;margin:2px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:0 12px;min-height:calc(3 * 1.35em);align-content:start;font:700 clamp(13px,4.6cqi,20px)/1.35 Nunito,sans-serif}
.mem li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;flex:none}
.bulb{position:relative;z-index:1;width:60px;height:60px;border-radius:50%;background:#fff;border:4px solid #f5c518;display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(120,80,0,.45)}
.bulb img{width:46px;height:46px;display:block}
.pill{margin-left:-16px;padding:5px 16px 3px 24px;background:#f5c518;color:#2b1a00;border:2px solid #d9a400;border-radius:999px;font:800 19px/1.1 "Baloo 2",sans-serif;white-space:nowrap}
.timer{background:var(--panel);border-radius:28px;box-shadow:var(--shadow);padding:clamp(16px,1.4vw,26px);display:flex;flex-direction:column;align-items:center;gap:14px;overflow:auto}
.clock{width:min(100%,360px);aspect-ratio:1;flex:none}
.clock svg{width:100%;height:100%;display:block}
.face{fill:light-dark(#fff,#10162b);stroke:var(--line);stroke-width:3}
#ticks line{stroke:var(--ink);stroke-linecap:round}
#ticks text{fill:var(--ink);font:700 13px "Baloo 2",sans-serif;text-anchor:middle;dominant-baseline:central}
#sector{fill:var(--alarm)}
#edge{stroke:#8f1518;stroke-width:3;stroke-linecap:round}
.knob{fill:var(--ink)}
.tside{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.digits{font-size:clamp(60px,5.6vw,100px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.digits.low{color:var(--alarm)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ctrl .rot{grid-column:1/-1;background:var(--sun);border-color:var(--sun);color:#1b1d2e}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.custom{display:flex;gap:8px}
.custom input{width:5.2em}
.sample{margin:0;font-size:13px;color:var(--muted);text-align:center}
input[type=text],input[type=number],textarea,select{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;font-size:17px}
textarea{resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.sheet{position:fixed;inset:0;background:rgba(12,16,38,.55);display:flex;justify-content:center;padding:2vh 2vw;z-index:20}
.panel{background:var(--bg);width:min(1140px,100%);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.ph{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:14px 20px;background:var(--panel)}
.ph h2{font-size:32px;font-weight:800}
.stepper{display:flex;align-items:center;gap:8px;font-weight:800}
.stepper output{font:800 30px/1 "Baloo 2",sans-serif;min-width:1.4em;text-align:center}
.stepper .btn{width:48px;padding:0;font-size:26px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 14px;background:var(--panel);border-bottom:2px solid var(--line)}
.tab{border:0;background:none;padding:10px 16px;min-height:52px;font-weight:800;border-bottom:4px solid transparent;white-space:nowrap;color:var(--muted)}
.tab[aria-selected=true]{border-color:var(--accent);color:var(--accent)}
.pb{flex:1;overflow:auto;padding:20px}
.pb h3{font-size:24px;margin:18px 0 8px}
.lead{margin:0;max-width:70ch;font-weight:600}
.hint{color:var(--muted);margin:6px 0;font-size:15px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.row.gap{justify-content:flex-start}
.field label,.lbl{display:block;font-weight:800;margin-bottom:4px}
.opt{font-weight:600;color:var(--muted)}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:16px}
.stc{background:var(--panel);border-radius:20px;padding:16px;border:2px solid var(--line);display:grid;gap:12px}
.stc.dirty{border-color:var(--sun)}
.sth{display:flex;align-items:center;gap:12px}
.sth .num{width:48px;height:48px;font-size:28px;border-radius:14px}
.sth h3{margin:0;font-size:24px}
.sta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.status{font-weight:800;color:var(--muted)}
.status.ok{color:var(--ok)}.status.warn{color:light-dark(#9a6200,#ffd27a)}.status.err,.err{color:var(--bad);font-weight:800}
.box{border-radius:16px;padding:12px 16px;background:var(--soft);margin:12px 0}
.box ul{margin:6px 0;padding-left:1.2em}
.box p{margin:6px 0 0}
.box.bad{background:light-dark(#fdeae7,#3b1f27);border:2px solid light-dark(#e6a59d,#8a3b46)}
.box.warn{background:light-dark(#fff3d6,#3a3020);border:2px solid light-dark(#f0cc7a,#8a6d2a)}
.box.good{background:light-dark(#e6f6ea,#1c3427);border:2px solid light-dark(#9fd8ae,#2f6b45)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
.stu{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stu .n{color:var(--muted);font-weight:800;text-align:right}
.stu.abs input[type=text]{text-decoration:line-through;opacity:.6}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:700;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--accent)}
.x{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:22px;font-weight:800}
.rform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;background:var(--panel);padding:14px;border-radius:18px;border:2px solid var(--line)}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--panel);border:2px solid var(--line)}
.rule.bad{border-color:var(--alarm)}
.note{grid-column:1/-1;font-size:14px;font-weight:700;color:var(--muted)}
.empty{color:var(--muted);font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.tcol{background:var(--panel);border-radius:18px;border:3px solid var(--tc);overflow:hidden;min-height:170px;transition:transform .12s}
.tcol.over{outline:4px dashed var(--accent);outline-offset:3px;transform:scale(1.02)}
.tcol header{background:var(--tc);color:var(--tx);padding:6px 10px;display:flex;gap:8px;align-items:center}
.tcol header input{background:transparent;border:0;color:inherit;font-weight:800;min-height:42px;padding:4px 6px;font-size:18px}
.tcol header input:focus{background:rgba(255,255,255,.2)}
.cnt{flex:none;background:rgba(0,0,0,.2);border-radius:999px;min-width:2em;text-align:center;font-weight:800;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.dragging{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-70%) rotate(-3deg);box-shadow:0 12px 24px -8px rgba(0,0,0,.45);border-color:var(--accent);background:var(--panel)}
.draw{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding:14px max(2vw,14px)}
.dh h2{font-size:clamp(30px,3vw,50px);font-weight:800}
.dmsg{margin:0;font:800 clamp(22px,2vw,34px)/1.1 "Baloo 2",sans-serif;color:var(--accent)}
.dacts{display:flex;gap:10px;flex-wrap:wrap}
.stage{--sh:clamp(42px,4.4vh,54px);position:relative;flex:1;min-height:0;overflow:auto;padding:4px max(2vw,14px) 24px}
.dcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:clamp(10px,1.2vw,18px)}
.dcol{border-radius:20px;border:3px solid var(--tc);background:var(--panel);overflow:hidden}
.dcol header{background:var(--tc);color:var(--tx);padding:8px 14px;display:flex;justify-content:space-between;gap:8px;font:800 clamp(18px,1.6vw,28px)/1.1 "Baloo 2",sans-serif;white-space:nowrap}
.dcol header span:first-child{overflow:hidden;text-overflow:ellipsis}
.slots{display:grid;gap:8px;padding:10px}
.slot{height:var(--sh);border-radius:12px;border:2px dashed var(--line)}
.dcard{position:absolute;left:0;top:0;height:var(--sh);display:flex;align-items:center;justify-content:center;padding:0 8px;border-radius:12px;background:var(--panel);border:2px solid var(--line);box-shadow:0 8px 18px -10px rgba(20,25,60,.5);font:800 clamp(16px,1.35vw,23px)/1 Nunito,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .42s cubic-bezier(.3,.7,.3,1),background .3s,color .3s,border-color .3s;will-change:transform}
.dcard.land{background:var(--tc);color:var(--tx);border-color:var(--tc);box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(12,16,38,.6);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--panel);border-radius:22px;padding:24px;max-width:580px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg h3{font-size:30px;margin-bottom:8px}
.dlg ul{padding-left:1.2em}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.menu{position:fixed;z-index:45;background:var(--panel);border-radius:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);padding:8px;width:250px;border:2px solid var(--line)}
.menu .mh{margin:4px 10px 6px;font-weight:800;color:var(--muted)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;min-height:46px;border:0;background:none;border-radius:10px;padding:6px 10px;font-weight:700;text-align:left}
.menu button:hover:not(:disabled){background:var(--soft)}
.menu button:disabled{opacity:.4}
.menu small{margin-left:auto;color:var(--muted)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--tc);flex:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
@media (min-width:1101px){.app{height:100vh}}
@media (max-width:1100px){
 .board{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
 .timer{order:-1;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:16px 28px}
 .clock{width:230px}.tside{width:auto;flex:1 1 300px;max-width:440px}
 .cards{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:auto}
 .card{grid-column:auto/span 2!important;min-height:230px}
 .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
 .rform,.rule{grid-template-columns:minmax(0,1fr)}
 .ph h2{font-size:26px}
}
@media (max-width:620px){
 .cards{grid-template-columns:minmax(0,1fr)}.card{grid-column:auto!important;min-height:0}
 .timer{flex-direction:column}.clock{width:min(78vw,300px)}
 .top .tools{width:100%}.top .tools .btn{flex:1 1 auto}
 .sheet{padding:0}.panel{border-radius:0}
}
@media (prefers-reduced-motion:reduce){.banner{animation:none}.tcol{transition:none}.dcard{transition:background .3s}}
</style>
</head>

/* ---------- reparto con reglas ---------- */
function analyze(s){
 const ids=s.students.filter(x=>!x.absent).map(x=>x.id),set=new Set(ids);
 const active=s.rules.filter(r=>set.has(r.a)&&set.has(r.b)&&r.a!==r.b);
 const par=new Map(ids.map(i=>[i,i]));
 const find=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x)}return x};
 const adj=new Map(ids.map(i=>[i,[]]));
 for(const r of active)if(r.type==='juntos'){par.set(find(r.a),find(r.b));adj.get(r.a).push([r.b,r]);adj.get(r.b).push([r.a,r])}
 const conflicts=[];
 for(const r of active)if(r.type==='separados'&&find(r.a)===find(r.b))conflicts.push({rule:r,path:pathRules(adj,r.a,r.b)});
 const gm=new Map();for(const i of ids){const k=find(i);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(i)}
 const groups=[...gm.values()],gi=new Map();groups.forEach((g,k)=>g.forEach(i=>gi.set(i,k)));
 const enemies=groups.map(()=>new Set());
 for(const r of active)if(r.type==='separados'){const x=gi.get(r.a),y=gi.get(r.b);if(x!==y){enemies[x].add(y);enemies[y].add(x)}}
 return {ids,active,conflicts,groups,enemies};
}
function pathRules(adj,a,b){
 const prev=new Map([[a,null]]),q=[a];
 while(q.length){const x=q.shift();if(x===b)break;for(const [y,r] of adj.get(x))if(!prev.has(y)){prev.set(y,[x,r]);q.push(y)}}
 const out=[];let c=b;while(prev.get(c)){const [p,r]=prev.get(c);out.unshift(r);c=p}return out;
}
function pack(G,en,k,cap){
 const order=shuffle(G.slice()).sort((a,b)=>b.size-a.size);
 const size=Array(k).fill(0),tg=Array.from({length:k},()=>[]);let nodes=0;
 const rec=idx=>{
  if(idx===order.length)return true;if(++nodes>5000)return false;
  const g=order[idx],cand=shuffle([...Array(k).keys()]).sort((a,b)=>size[a]-size[b]);let triedEmpty=false;
  for(const t of cand){
   if(size[t]+g.size>cap)continue;
   if(size[t]===0){if(triedEmpty)continue;triedEmpty=true}
   if(tg[t].some(h=>en[g.i].has(h)))continue;
   size[t]+=g.size;tg[t].push(g.i);if(rec(idx+1))return true;size[t]-=g.size;tg[t].pop();
  }
  return false};
 if(!rec(0))return null;
 return {teams:tg,spread:Math.max(...size)-Math.min(...size)};
}
function distribute(s){
 const k=s.n,A=analyze(s),N=A.ids.length;
 if(!N)return {error:'empty'};
 if(A.conflicts.length)return {error:'conflict',conflicts:A.conflicts};
 const G=A.groups.map((ids,i)=>({i,ids,size:ids.length})),ideal=N%k?1:0;let best=null;
 for(let cap=Math.ceil(N/k);cap<=N&&!best;cap++){
  for(let t=0;t<40;t++){const r=pack(G,A.enemies,k,cap);if(r&&(!best||r.spread<best.spread))best=r;if(best&&best.spread<=ideal)break}
 }
 if(!best)return {error:'apart',rules:A.active.filter(r=>r.type==='separados')};
 const teams=shuffle(best.teams.map(gs=>gs.flatMap(g=>G[g].ids)));
 teams.forEach(m=>m.sort((a,b)=>nm(s,a).localeCompare(nm(s,b),'es')));
 return {teams,sizes:teams.map(m=>m.length),uneven:best.spread>ideal};
}

 const r=distribute(s);if(r.teams){r.teams.forEach((m,i)=>s.teams[i].members=m);s.generated=true}
 return s;
}
function load(){

 s.n=Math.min(8,Math.max(2,(s.n|0)||5));
 s.stations=s.stations.slice(0,8).map(x=>({title:String(x?.title||''),desc:String(x?.desc||'')}));while(s.stations.length<8)s.stations.push({title:'',desc:''});
 s.teams=Array.from({length:s.n},(_,i)=>({name:s.teams[i]?.name||'Equipo '+COLORS[i][0],members:(s.teams[i]?.members||[]).filter(id=>s.students.some(x=>x.id===id&&!x.absent))}));
 s.rules=Array.isArray(s.rules)?s.rules:[];s.exceptions=Array.isArray(s.exceptions)?s.exceptions:[];
 s.duration=Math.min(60,Math.max(1,(s.duration|0)||30));s.rounds=s.rounds|0;
 if(!s.timer||!['idle','running','paused','ended'].includes(s.timer.status))s.timer={status:'idle',endAt:0,remain:s.duration*60000};
 if(!['play','rotate','done'].includes(s.phase))s.phase='play';
 s.round=Math.max(0,s.round|0);return s;
}

function dialog({title,html,actions}){

  const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;document.removeEventListener('keydown',key,true);res(v)};

  document.addEventListener('keydown',key,true);
  m.onclick=e=>{const b=e.target.closest('[data-i]');if(b)done(actions[+b.dataset.i].value)};
 });
}

function renderBoard(){

   ${S.showMembers?`<ul class="mem">${mem.length?mem.map(m=>`<li>${esc(m)}</li>`).join(''):'<li>Sin integrantes</li>'}</ul>`:''}</div></article>`}).join('');

 const b=$('#banner');
 if(S.phase==='rotate')b.innerHTML=`<div class="banner" role="alert"><h2>¡Rotamos!</h2><p>Cada equipo pasa a la estación siguiente (1 → 2 … ${n} → 1). Cuando estén listos para moverse, confirmá.</p><button class="btn big" id="confirmRot">Confirmar rotación</button></div>`;
 else if(S.phase==='done')b.innerHTML=`<div class="banner" role="alert"><h2>¡Terminamos las estaciones!</h2><p>Se completaron las ${R} rondas.</p><button class="btn big" id="newDay">Nueva jornada</button></div>`;
 else b.innerHTML='';

/* ---------- temporizador ---------- */
const RR=86;
{const tk=[];for(let m=0;m<60;m++){const a=m/60*2*Math.PI,s=Math.sin(a),c=Math.cos(a),r1=m%5?95:90;
 tk.push(`<line x1="${(-r1*s).toFixed(2)}" y1="${(-r1*c).toFixed(2)}" x2="${(-100*s).toFixed(2)}" y2="${(-100*c).toFixed(2)}" stroke-width="${m%5?1.2:2.6}"/>`);
 if(m%5===0)tk.push(`<text x="${(-109*s).toFixed(2)}" y="${(-109*c).toFixed(2)}">${m}</text>`)}
 $('#ticks').innerHTML=tk.join('')}
function remaining(){const t=S.timer;if(t.status==='running')return Math.max(0,t.endAt-Date.now());if(t.status==='ended')return 0;return t.remain}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function renderTimer(){
 const rem=remaining(),f=Math.min(1,rem/3600000),sec=$('#sector'),edge=$('#edge');
 if(f<=0){sec.setAttribute('d','');edge.style.display='none'}
 else if(f>=.9999){sec.setAttribute('d',`M0,${-RR}A${RR},${RR} 0 1,0 0,${RR}A${RR},${RR} 0 1,0 0,${-RR}Z`);edge.style.display='';edge.setAttribute('x2',0);edge.setAttribute('y2',-RR)}
 else{const a=f*2*Math.PI,x=-RR*Math.sin(a),y=-RR*Math.cos(a);
  sec.setAttribute('d',`M0,0L0,${-RR}A${RR},${RR} 0 ${a>Math.PI?1:0},0 ${x.toFixed(2)},${y.toFixed(2)}Z`);
  edge.style.display='';edge.setAttribute('x2',x.toFixed(2));edge.setAttribute('y2',y.toFixed(2))}
 const d=$('#digits');d.textContent=fmt(rem);d.classList.toggle('low',rem>0&&rem<60000);
 const st=S.timer.status,mb=$('#mainBtn');
 mb.textContent={idle:'Iniciar',running:'Pausar',paused:'Reanudar',ended:'Iniciar'}[st];
 mb.disabled=st==='ended'||S.phase!=='play'||(st==='idle'&&rem<=0);
 document.querySelectorAll('[data-qdur]').forEach(b=>b.classList.toggle('on',+b.dataset.qdur===S.duration));
 const rn=$('#rotNow');rn.disabled=S.phase!=='play';rn.textContent=S.round+1>=totalRounds()?'Terminar estaciones':'Rotar ahora';
}
let ac=null;
function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){ac=null}}
function chime(){if(!ac)return;try{[660,880,1046].forEach((fq,i)=>{const t0=ac.currentTime+i*.28,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=fq;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.7);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+.75)})}catch(e){}}
function tick(){
 if(S.timer.status==='running'&&Date.now()>=S.timer.endAt){
  S.timer.status='ended';S.timer.remain=0;S.phase=S.round+1>=totalRounds()?'done':'rotate';save();chime();renderBoard();
 }else renderTimer();
}
function resetTimer(){S.timer={status:'idle',endAt:0,remain:S.duration*60000}}
function setDuration(m){
 m=Math.round(+m);if(!(m>=1&&m<=60)){toast('Elegí una duración entre 1 y 60 minutos.');return}
 S.duration=m;
 if(S.timer.status==='running'||S.timer.status==='paused')toast(`Duración: ${m} min. Se aplica al reiniciar o en la próxima ronda.`);
 else if(S.phase==='play'){resetTimer();toast(`Reloj listo con ${m} minutos.`)}
 save();renderTimer();
}

  const have=new Set(S.students.map(s=>s.name.toLowerCase()));let skip=0,add=0;

 else doIt();
}

function ruleStatus(){
 const A=analyze(S),bad=new Set();let html='';
 if(A.conflicts.length){
  A.conflicts.forEach(c=>{bad.add(c.rule.id);c.path.forEach(r=>bad.add(r.id))});
  html=`<div class="box bad"><strong>Estas reglas se contradicen y no permiten hacer el reparto:</strong><ul>${A.conflicts.map(c=>`<li>«${esc(ruleText(c.rule))}», pero ${c.path.map(r=>'«'+esc(ruleText(r))+'»').join(' y ')} ${c.path.length>1?'obligan':'obliga'} a que queden en el mismo equipo.</li>`).join('')}</ul><p>Corregí o borrá alguna de las reglas marcadas en rojo.</p></div>`;
 }else if(A.active.length){
  const D=distribute(S);
  if(D.error==='apart'){D.rules.forEach(r=>bad.add(r.id));html=`<div class="box bad"><strong>Con ${S.n} equipos no se pueden cumplir todas las reglas de separación a la vez.</strong><p>Revisá las reglas «deben quedar separados» marcadas en rojo o aumentá la cantidad de equipos.</p></div>`}
  else if(D.uneven)html=`<div class="box warn">Se pueden respetar todas las reglas, pero los equipos quedarían desparejos (por ejemplo: ${listJoin(D.sizes.slice().sort((a,b)=>b-a))} integrantes).</div>`;
  else if(D.teams)html='<div class="box good">Todas las reglas se pueden cumplir con equipos parejos.</div>';
 }
 return {html,bad};
}

function ruleError(a,b,ignore){
 if(a===b)return 'Elegí dos alumnos distintos.';

 ${open.length?`<div class="box warn"><strong>Reglas que no se cumplen en el reparto actual:</strong><ul>${open.map(r=>`<li>${esc(ruleText(r))}</li>`).join('')}</ul><p>Volvé a sortear o mové a alguien para corregirlo.</p></div>`:''}

function generate(){
 const r=distribute(S);
 if(r.error==='empty')lastGen='<div class="box bad">No hay alumnos presentes. Cargá la lista en la pestaña Alumnos.</div>';
 else if(r.error==='conflict')lastGen=`<div class="box bad"><strong>No se pudo hacer el reparto porque hay reglas que se contradicen:</strong><ul>${r.conflicts.map(c=>`<li>«${esc(ruleText(c.rule))}», pero ${c.path.map(x=>'«'+esc(ruleText(x))+'»').join(' y ')} ${c.path.length>1?'obligan':'obliga'} a que queden juntos.</li>`).join('')}</ul><p><button class="btn" data-goto="reglas">Corregir reglas</button></p></div>`;
 else if(r.error==='apart')lastGen=`<div class="box bad"><strong>Con ${S.n} equipos no se pueden cumplir todas las reglas de separación.</strong><p><button class="btn" data-goto="reglas">Revisar reglas</button></p></div>`;
 else{
  r.teams.forEach((m,i)=>S.teams[i].members=m);S.exceptions=[];S.generated=true;save();
  lastGen=r.uneven?`<div class="box warn">Se respetaron todas las reglas. El reparto más parejo posible queda así: ${sizesLine()}.</div>`:`<div class="box good">Listo: equipos de ${listJoin(r.sizes.slice().sort((a,b)=>b-a))} integrantes.</div>`;
 }
 renderConfig();renderBoard();
}
async function moveStudent(id,to){
 const from=teamOf(id);if(from===to)return;
 const snap=S.teams.map(t=>t.members.slice());
 S.teams.forEach(t=>t.members=t.members.filter(x=>x!==id));if(to>=0){S.teams[to].members.push(id);sortTeam(to)}
 const viol=analyze(S).active.filter(r=>(r.a===id||r.b===id)&&!S.exceptions.includes(r.id)&&violated(r));
 if(viol.length){
  const ok=await dialog({title:viol.length>1?'Este cambio rompe reglas':'Este cambio rompe una regla',html:`<ul>${viol.map(r=>`<li><strong>${esc(ruleText(r))}</strong></li>`).join('')}</ul><p>Podés cancelar el movimiento o confirmarlo como excepción solo para esta jornada.</p>`,actions:[{label:'Cancelar movimiento',value:false},{label:'Confirmar como excepción',value:true,pri:true}]});
  if(!ok){S.teams.forEach((t,i)=>t.members=snap[i]);renderConfig();return}
  viol.forEach(r=>S.exceptions.includes(r.id)||S.exceptions.push(r.id));
 }
 save();renderConfig();renderBoard();toast(`${nameOf(id)} pasó a ${to<0?'Sin equipo':S.teams[to].name}.`);
}

document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pid)return;
 if(!drag.on){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;drag.on=true;closeMenu();drag.g=drag.c.cloneNode(true);drag.g.classList.add('ghost');document.body.appendChild(drag.g);drag.c.classList.add('dragging')}
 e.preventDefault();drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
 const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]')||null;
 if(t!==drag.t){drag.t?.classList.remove('over');t?.classList.add('over');drag.t=t}
},{passive:false});
function endDrag(e,cancel){
 if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;
 if(!d.on)return;suppress=true;setTimeout(()=>suppress=false,350);
 d.g.remove();d.c.classList.remove('dragging');d.t?.classList.remove('over');

}

function openDraw(){unlock();closeMenu();$('#config').hidden=true;$('#draw').hidden=false;runDraw()}
function closeDraw(){clearDraw();$('#draw').hidden=true;stage.querySelectorAll('.dcard').forEach(c=>c.remove());renderBoard()}
const setActs=a=>{$('#drawActs').innerHTML=a.map(([k,l,p])=>`<button class="btn big ${p?'pri':''}" data-d="${k}">${l}</button>`).join('')};
function sizeCards(){const s=stage.querySelector('.slot');if(!s)return;const w=s.offsetWidth;drawCards.forEach(o=>o.el.style.width=w+'px');return w}
function scatter(){
 const w=sizeCards()||150,sh=drawCards[0]?.el.offsetHeight||48,W=stage.clientWidth,H=Math.max(stage.clientHeight,$('#dcols').offsetHeight+30);
 drawCards.forEach(o=>{const x=Math.random()*Math.max(0,W-w),y=Math.random()*Math.max(0,H-sh),r=Math.random()*18-9;o.el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`});
}
function slotPos(o){const sr=o.slot.getBoundingClientRect(),st=stage.getBoundingClientRect();return [sr.left-st.left+stage.scrollLeft,sr.top-st.top+stage.scrollTop]}
function placeAll(){drawCards.forEach(o=>{const [x,y]=slotPos(o);o.el.style.transform=`translate(${x}px,${y}px)`;o.el.classList.add('land')})}
function runDraw(){
 clearDraw();settled=false;stage.querySelectorAll('.dcard').forEach(c=>c.remove());drawCards=[];
 const r=distribute(S);drawRes=r.teams?r:null;
 if(!r.teams){
  $('#dcols').innerHTML='';
  $('#drawMsg').textContent=r.error==='empty'?'No hay alumnos presentes. Cargá la lista en Configuración.':'No se pudo hacer el sorteo con la configuración actual. Revisala en Configuración → Equipos.';
  setActs([['close','Volver al tablero',true]]);return;
 }
 $('#dcols').innerHTML=r.teams.map((m,i)=>`<section class="dcol" style="--tc:${COLORS[i][1]};--tx:${COLORS[i][2]}"><header><span>${esc(S.teams[i].name)}</span><span>${m.length}</span></header><div class="slots">${m.map(()=>'<div class="slot"></div>').join('')}</div></section>`).join('');
 const slots=[...$('#dcols').querySelectorAll('.dcol')].map(c=>[...c.querySelectorAll('.slot')]);
 drawCards=shuffle(r.teams.flatMap((m,t)=>m.map((id,k)=>({id,t,slot:slots[t][k]})))).map(o=>{
  const d=document.createElement('div');d.className='dcard';d.textContent=nameOf(o.id);d.style.setProperty('--tc',COLORS[o.t][1]);d.style.setProperty('--tx',COLORS[o.t][2]);
  stage.appendChild(d);return {...o,el:d}});
 const w=sizeCards()||150,cx=(stage.clientWidth-w)/2,cy=Math.max(0,stage.clientHeight/2-30);
 drawCards.forEach(o=>{o.el.style.transition='none';o.el.style.transform=`translate(${cx+Math.random()*40-20}px,${cy+Math.random()*40-20}px) rotate(${Math.random()*30-15}deg)`});
 stage.offsetHeight;drawCards.forEach(o=>o.el.style.transition='');
 $('#drawMsg').textContent='Mezclando…';setActs([['skip','Saltar']]);
 if(reduced){settle();return}
 for(let k=0;k<9;k++)drawTimers.push(setTimeout(scatter,120+k*420));
 drawTimers.push(setTimeout(settle,120+9*420+200));
}
function settle(){
 clearDraw();$('#drawMsg').textContent='¡Ya casi!';setActs([]);
 const order=drawCards.slice().sort((a,b)=>a.t-b.t||[...a.slot.parentNode.children].indexOf(a.slot)-[...b.slot.parentNode.children].indexOf(b.slot));
 const step=reduced?0:Math.min(45,900/order.length);
 order.forEach((o,i)=>drawTimers.push(setTimeout(()=>{const [x,y]=slotPos(o);o.el.style.transform=`translate(${x}px,${y}px)`;o.el.classList.add('land')},i*step)));
 drawTimers.push(setTimeout(()=>{settled=true;$('#drawMsg').textContent='¡Estos son los equipos!';chime();setActs([['cancel','Cancelar'],['again','Sortear otra vez'],['use','Usar estos equipos',true]])},order.length*step+550));
}
$('#drawActs').addEventListener('click',e=>{
 const k=e.target.closest('[data-d]')?.dataset.d;if(!k)return;
 if(k==='skip')settle();
 else if(k==='again')runDraw();
 else if(k==='use'&&drawRes){
  drawRes.teams.forEach((m,i)=>S.teams[i].members=m.slice());S.exceptions=[];S.generated=true;
  lastGen=`<div class="box good">Equipos del sorteo en vivo: ${sizesLine()}.</div>`;save();closeDraw();toast('¡Equipos listos!');
 }else closeDraw();
});
addEventListener('resize',()=>{if($('#draw').hidden||!drawCards.length)return;sizeCards();if(settled)placeAll()});
$('#openDraw').onclick=openDraw;

document.addEventListener('visibilitychange',tick);
setInterval(tick,250);
save();renderBoard();tick();
}
</script>
</body>
</html>
